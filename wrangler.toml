name = "megapalpite"
main = "src/worker.js"
compatibility_date = "2026-09-11"

# Depois de criar o banco D1, substitua pelo ID real.
[[d1_databases]]
binding = "DB"
database_name = "megapalpite-db"
database_id = "COLOQUE_AQUI_O_DATABASE_ID"

# Variáveis públicas de configuração do Cloudflare Access.
# Não coloque segredos aqui.
[vars]
ACCESS_TEAM_DOMAIN = "COLOQUE_AQUI.seudominio.com"
ACCESS_AUD = "COLOQUE_AQUI"

# E-mails autorizados a administrar o banco, separados por vírgula.
# Para maior segurança, prefira um único e-mail.
ADMIN_EMAILS = "seu-email@exemplo.com"

# O Worker serve os endpoints da API. Os arquivos estáticos do site
# continuam no diretório public/ e devem ser publicados pelo método
# de assets escolhido no seu projeto Cloudflare.

# Publica automaticamente os arquivos de public/ como Assets do Worker.
[assets]
directory = "./public"
binding = "ASSETS"

