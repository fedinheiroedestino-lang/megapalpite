<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin — MegaPalpite</title>
<style>
body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;max-width:900px;margin:auto;padding:24px;background:#f6f7f9;color:#1b1f24}
.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:22px;margin:16px 0;box-shadow:0 2px 10px #0000000a}
h1{margin-top:0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
label{display:block;font-weight:700;font-size:14px}input{width:100%;box-sizing:border-box;padding:11px;margin-top:6px;border:1px solid #bbb;border-radius:9px}
.numbers{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
button{border:0;border-radius:9px;padding:11px 16px;font-weight:700;cursor:pointer}.primary{background:#111;color:#fff}
pre{white-space:pre-wrap;background:#f1f2f4;padding:14px;border-radius:10px}.ok{color:#146c2e}.err{color:#a51d2d}
@media(max-width:650px){.grid{grid-template-columns:1fr}.numbers{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div class="card">
<h1>Painel administrativo — MegaPalpite</h1>
<p>Esta página deve ser publicada atrás do <strong>Cloudflare Access</strong>. Não coloque senha administrativa no código.</p>
</div>

<div class="card">
<h2>Novo concurso</h2>
<div class="grid">
<label>Concurso<input id="concurso" type="number" min="1" placeholder="3057"></label>
<label>Data<input id="data" type="date"></label>
</div>
<p><strong>Dezenas</strong></p>
<div class="numbers">
<input class="dezena" type="number" min="1" max="60">
<input class="dezena" type="number" min="1" max="60">
<input class="dezena" type="number" min="1" max="60">
<input class="dezena" type="number" min="1" max="60">
<input class="dezena" type="number" min="1" max="60">
<input class="dezena" type="number" min="1" max="60">
</div>
<div class="actions">
<button onclick="auditar()">Auditar banco</button>
<button class="primary" onclick="validarESalvar()">Validar e salvar</button>
</div>
<pre id="saida">Pronto.</pre>
</div>

<script>
const $=id=>document.getElementById(id);
function payload(){
  return {
    concurso:Number($("concurso").value),
    data_sorteio:$("data").value,
    dezenas:[...document.querySelectorAll(".dezena")].map(x=>Number(x.value))
  };
}
function show(obj, cls=""){ $("saida").className=cls; $("saida").textContent=typeof obj==="string"?obj:JSON.stringify(obj,null,2); }
function localValidate(p){
  if(!Number.isInteger(p.concurso)||p.concurso<1) throw Error("Informe um número de concurso válido.");
  if(!p.data_sorteio) throw Error("Informe a data do sorteio.");
  if(p.dezenas.length!==6||p.dezenas.some(n=>!Number.isInteger(n)||n<1||n>60)) throw Error("As seis dezenas devem estar entre 1 e 60.");
  const s=[...p.dezenas].sort((a,b)=>a-b);
  if(new Set(s).size!==6) throw Error("Não pode haver dezenas repetidas.");
  p.dezenas=s; return p;
}
async function auditar(){
  try{
    const r=await fetch("/api/admin/auditar",{method:"POST"});
    show(await r.json());
  }catch(e){show(e.message,"err")}
}
async function validarESalvar(){
  try{
    const p=localValidate(payload());
    show({status:"VALIDADO — revise os dados antes de confirmar.",...p});
    if(!confirm(`Confirmar o concurso ${p.concurso} com as dezenas ${p.dezenas.map(n=>String(n).padStart(2,"0")).join(" - ")}?`)) return;
    const r=await fetch("/api/admin/concursos",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(p)});
    const data=await r.json();
    show(data,data.ok?"ok":"err");
  }catch(e){show(e.message,"err")}
}
</script>
</body>
</html>
